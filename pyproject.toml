[project]
name = "document-rag"
version = "0.1.0"
description = "Locally hosted Document RAG system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "python-docx>=1.2.0",
    "fastembed>=0.3.6",
    "chromadb>=1.5.7",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.27.2.2",
    "llama-cpp-python>=0.3.0",
    "opendataloader-pdf>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
