services:
  app:
    build: .
    image: document-rag-app:local
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - CORS_ORIGINS=*
      - DATABASE_URL=sqlite:////data/app.db
      - CHROMA_PATH=/data/chroma
      - UPLOAD_DIR=/uploads
      - LLM_MODEL_PATH=/models/microsoft_Phi-4-mini-instruct-Q4_K_M.gguf
      - LLM_N_THREADS=4
      - LLM_N_GPU_LAYERS=0
    volumes:
      - app_data:/data
      - app_uploads:/uploads
      - hf_cache:/root/.cache/huggingface
      - models_data:/models

volumes:
  app_data:
  app_uploads:
  hf_cache:
  models_data:
