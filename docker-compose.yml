services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - CORS_ORIGINS=*
      - DATABASE_URL=sqlite:////data/app.db
      - CHROMA_PATH=/data/chroma
      - UPLOAD_DIR=/uploads
    volumes:
      - app_data:/data
      - app_uploads:/uploads
      - hf_cache:/root/.cache/huggingface

volumes:
  app_data:
  app_uploads:
  hf_cache:
